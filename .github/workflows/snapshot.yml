name: snapshot

# Runs the same cross-compile build as release.yml, but with --skip=publish
# so it never needs credentials or touches the tap/bucket repos. Catches a
# broken .goreleaser.yaml or cross-compile failure on every push/PR instead
# of only discovering it when a real tag is pushed.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GOLANG_CROSS_VERSION: v1.25.5

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build snapshot
        run: |
          docker run --rm \
            -e CGO_ENABLED=1 \
            -v "$PWD":/go/src/github.com/appversal/appstorys-cli \
            -w /go/src/github.com/appversal/appstorys-cli \
            "ghcr.io/goreleaser/goreleaser-cross:${GOLANG_CROSS_VERSION}" \
            --clean --skip=validate --skip=publish --snapshot
