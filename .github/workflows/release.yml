name: release

# cgo (tree-sitter) rules out plain `goreleaser release` — it can't cross
# compile a C dependency. This runs goreleaser inside the goreleaser-cross
# Docker image instead (https://github.com/goreleaser/goreleaser-cross),
# which bundles a working C cross compiler for every target in
# .goreleaser.yaml on a single Linux runner. Bump GOLANG_CROSS_VERSION
# whenever go.mod's `go` directive changes — the image is tagged by Go
# version, and .goreleaser.yaml's CC choices assume its bundled toolchains.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  GOLANG_CROSS_VERSION: v1.25.5

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with repo access to appversal/homebrew-tap and
          # appversal/scoop-bucket — the default GITHUB_TOKEN above is
          # scoped to this repo only and can't push to either.
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          docker run --rm \
            -e CGO_ENABLED=1 \
            -e GITHUB_TOKEN \
            -e TAP_GITHUB_TOKEN \
            -v "$PWD":/go/src/github.com/appversal/appstorys-cli \
            -w /go/src/github.com/appversal/appstorys-cli \
            "ghcr.io/goreleaser/goreleaser-cross:${GOLANG_CROSS_VERSION}" \
            release --clean
